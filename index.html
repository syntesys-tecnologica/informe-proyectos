<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captura de fotos — Informe técnico</title>
<style>
  :root{
    --ink:#1c1c1a; --ink-soft:#6b6a64; --paper:#faf9f6; --card:#ffffff;
    --line:#e4e2da; --accent:#1d5c4a; --accent-ink:#eef6f2; --accent-strong:#12392e;
    --warn:#a3491f; --warn-bg:#fbeee5; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper); color:var(--ink); min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 32px}
  header{padding:18px 4px 10px}
  header h1{font-size:17px;margin:0 0 2px;font-weight:600}
  header p{margin:0;font-size:13px;color:var(--ink-soft)}

  .progress-row{display:flex;align-items:center;gap:10px;margin:14px 0 18px}
  .progress-track{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
  .progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .progress-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:14px}

  .setup-field{margin-bottom:14px}
  .setup-field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px}
  .setup-field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--paper);color:var(--ink)}

  .section-eyebrow{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .section-name{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 18px}

  .photo-frame{
    aspect-ratio:4/3;border-radius:10px;background:var(--paper);border:1px dashed var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;position:relative;
  }
  .photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-frame .empty-hint{color:var(--ink-soft);font-size:13px;text-align:center;padding:0 20px}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:15px 16px;border-radius:11px;border:1px solid transparent;
    font-size:15px;font-weight:600;cursor:pointer;text-align:center;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:active{background:var(--accent-strong)}
  .btn-secondary{background:var(--card);color:var(--ink);border-color:var(--line)}
  .btn-secondary:active{background:var(--paper)}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:none;font-weight:500;padding:12px}
  .btn-row{display:flex;gap:10px;margin-top:10px}
  .btn-row .btn{flex:1}
  .btn[disabled]{opacity:.45;pointer-events:none}

  input[type=file]{display:none}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .nav-row button{background:none;border:none;color:var(--ink-soft);font-size:14px;padding:10px 4px;cursor:pointer}
  .nav-row button:disabled{opacity:.3}

  .list-item{
    display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .list-item:last-child{border-bottom:none}
  .status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--line)}
  .status-dot.done{background:var(--accent)}
  .status-dot.skip{background:#c8a24a}
  .list-item .li-text{flex:1;font-size:14px}
  .list-item .li-num{font-size:12px;color:var(--ink-soft);width:28px;flex-shrink:0}

  .banner{background:var(--accent-ink);color:var(--accent-strong);border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:var(--warn-bg);color:var(--warn)}

  .tabbar{display:flex;gap:8px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);cursor:pointer}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .hidden{display:none !important}

  #summaryBox{font-size:13px;color:var(--ink-soft);text-align:center;margin:14px 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Captura de fotos del informe</h1>
    <p>Toma cada foto en orden. Al final se arma el informe solo.</p>
  </header>

  <!-- ============ PANTALLA 0: DATOS DE LA VISITA ============ -->
  <div id="screen-setup" class="card">
    <p class="section-eyebrow">Antes de empezar</p>
    <p class="section-name" style="font-size:18px">Datos de la visita</p>
    <div class="setup-field">
      <label>Nombre de la tienda</label>
      <input type="text" id="fTienda" placeholder="Ej. Baranoa">
    </div>
    <div class="setup-field">
      <label>Ciudad</label>
      <input type="text" id="fCiudad" placeholder="Ej. Baranoa, Atlántico">
    </div>
    <div class="setup-field">
      <label>Técnico responsable</label>
      <input type="text" id="fTecnico" placeholder="Tu nombre">
    </div>
    <div class="setup-field">
      <label>Fecha</label>
      <input type="date" id="fFecha">
    </div>
    <button class="btn btn-primary" id="btnStart">Empezar a tomar fotos</button>
  </div>

  <!-- ============ PANTALLA 1: CAPTURA ============ -->
  <div id="screen-capture" class="hidden">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>

    <div class="tabbar">
      <div class="tab active" id="tabCapture">Capturar</div>
      <div class="tab" id="tabList">Ver lista</div>
    </div>

    <div id="captureView">
      <div class="card">
        <p class="section-eyebrow" id="itemCounter">Casilla 1 de 266</p>
        <p class="section-name" id="itemName">—</p>

        <div class="photo-frame" id="photoFrame">
          <p class="empty-hint">Aún no has tomado esta foto</p>
        </div>

        <label class="btn btn-primary" id="btnTakePhoto">
          <span>Tomar foto</span>
          <input type="file" accept="image/*" capture="environment" id="fileInput">
        </label>
        <div class="btn-row">
          <button class="btn btn-secondary" id="btnRetake" disabled>Repetir foto</button>
          <button class="btn btn-secondary" id="btnSkip">Saltar casilla</button>
        </div>

        <div class="nav-row">
          <button id="btnPrev">← Anterior</button>
          <button id="btnNext">Siguiente →</button>
        </div>
      </div>

      <button class="btn btn-secondary" id="btnFinishEarly">Terminar y generar informe ahora</button>
    </div>

    <div id="listView" class="hidden">
      <div class="card" style="padding:6px 14px;max-height:60vh;overflow-y:auto" id="listContainer"></div>
      <button class="btn btn-primary" id="btnGenerateFromList">Generar informe</button>
    </div>
  </div>

  <!-- ============ PANTALLA 2: GENERANDO ============ -->
  <div id="screen-generating" class="hidden card" style="text-align:center">
    <p class="section-name" style="font-size:17px">Generando el informe…</p>
    <p id="genStatus" style="color:var(--ink-soft);font-size:13px">Procesando fotos</p>
  </div>

  <!-- ============ PANTALLA 3: LISTO ============ -->
  <div id="screen-done" class="hidden card" style="text-align:center">
    <p class="section-name" style="font-size:18px">Informe generado</p>
    <p id="doneSummary" style="color:var(--ink-soft);font-size:14px;margin-bottom:18px"></p>
    <button class="btn btn-primary" id="btnShare">Compartir informe</button>
    <button class="btn btn-secondary" id="btnDownload" style="margin-top:10px">Descargar informe (PDF)</button>
    <button class="btn btn-ghost" id="btnBackToList" style="margin-top:6px">Volver a revisar fotos</button>
  </div>

</div>

const state = CHECKLIST.map(() => ({ dataUrl: null, skipped: false }));
let current = 0;
let visita = {};
let generatedPdfBlob = null;

const $ = (id) => document.getElementById(id);

function completedCount(){
  return state.filter(s => s.dataUrl || s.skipped).length;
}

function goto(screenId){
  ['screen-setup','screen-capture','screen-generating','screen-done'].forEach(id=>{
    $(id).classList.toggle('hidden', id !== screenId);
  });
}

$('fFecha').value = new Date().toISOString().slice(0,10);

  visita = {
    tienda: $('fTienda').value.trim() || '(sin nombre)',
    ciudad: $('fCiudad').value.trim() || '(sin ciudad)',
    tecnico: $('fTecnico').value.trim() || '(sin nombre)',
    fecha: $('fFecha').value || new Date().toISOString().slice(0,10),
  };
  goto('screen-capture');
  renderCurrent();
  renderList();
});

$('tabCapture').addEventListener('click', () => switchTab('capture'));
$('tabList').addEventListener('click', () => switchTab('list'));
function switchTab(which){
  $('tabCapture').classList.toggle('active', which === 'capture');
  $('tabList').classList.toggle('active', which === 'list');
  $('captureView').classList.toggle('hidden', which !== 'capture');
  $('listView').classList.toggle('hidden', which !== 'list');
  if (which === 'list') renderList();
}

function renderCurrent(){
  const item = CHECKLIST[current];
  const s = state[current];
  $('itemCounter').textContent = `Casilla ${current+1} de ${CHECKLIST.length}`;
  $('itemName').textContent = item.s;
  $('progressLabel').textContent = `${completedCount()} / ${CHECKLIST.length}`;
  $('progressFill').style.width = (completedCount() / CHECKLIST.length * 100) + '%';

  const frame = $('photoFrame');
  if (s.dataUrl){
    frame.innerHTML = `<img src="${s.dataUrl}" alt="Foto de ${item.s}">`;
    $('btnRetake').disabled = false;
  } else if (s.skipped){
    frame.innerHTML = `<p class="empty-hint">Casilla saltada</p>`;
    $('btnRetake').disabled = true;
  } else {
    frame.innerHTML = `<p class="empty-hint">Aún no has tomado esta foto</p>`;
    $('btnRetake').disabled = true;
  }
  $('btnPrev').disabled = current === 0;
  $('btnNext').disabled = current === CHECKLIST.length - 1;
}

function resizeImage(file, maxWidth, quality){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxWidth){
        height = Math.round(height * (maxWidth / width));
        width = maxWidth;
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = url;
  });
}

$('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const dataUrl = await resizeImage(file, 1400, 0.78);
  state[current].dataUrl = dataUrl;
  state[current].skipped = false;
  renderCurrent();
  e.target.value = '';
  if (current < CHECKLIST.length - 1){
    setTimeout(() => { current++; renderCurrent(); }, 350);
  }
});

$('btnRetake').addEventListener('click', () => {
  state[current].dataUrl = null;
  renderCurrent();
});

$('btnSkip').addEventListener('click', () => {
  state[current].dataUrl = null;
  state[current].skipped = true;
  renderCurrent();
  if (current < CHECKLIST.length - 1){
    current++; renderCurrent();
  }
});

$('btnPrev').addEventListener('click', () => { if (current>0){ current--; renderCurrent(); }});
$('btnNext').addEventListener('click', () => { if (current<CHECKLIST.length-1){ current++; renderCurrent(); }});

function renderList(){
  const container = $('listContainer');
  container.innerHTML = '';
  CHECKLIST.forEach((item, i) => {
    const s = state[i];
    const row = document.createElement('div');
    row.className = 'list-item';
    const dotClass = s.dataUrl ? 'done' : (s.skipped ? 'skip' : '');
    row.innerHTML = `
      <span class="li-num">${i+1}</span>
      <span class="status-dot ${dotClass}"></span>
      <span class="li-text">${item.s}</span>
    `;
    row.addEventListener('click', () => {
      current = i;
      switchTab('capture');
      renderCurrent();
    });
    container.appendChild(row);
  });
}

async function generateReport(){
  goto('screen-generating');
  await new Promise(r => setTimeout(r, 50));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 48;

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('Informe técnico', margin, 90);
  doc.setFontSize(13);
  doc.text('CCTV IP / Alarma de intrusión / Detección de incendio', margin, 112);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  const info = [
    ['Tienda', visita.tienda],
    ['Ciudad', visita.ciudad],
    ['Técnico responsable', visita.tecnico],
    ['Fecha', visita.fecha],
  ];
  let y = 160;
  info.forEach(([label, value]) => {
    doc.setFont('helvetica', 'bold');
    doc.text(label + ':', margin, y);
    doc.setFont('helvetica', 'normal');
    doc.text(String(value), margin + 140, y);
    y += 22;
  });

  const taken = CHECKLIST.map((item, i) => ({ item, s: state[i] })).filter(x => x.s.dataUrl);
  const skipped = CHECKLIST.map((item, i) => ({ item, s: state[i] })).filter(x => x.s.skipped);

  y += 20;
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(`Fotos incluidas: ${taken.length} de ${CHECKLIST.length}`, margin, y);
  y += 18;
  doc.text(`Casillas marcadas como no aplicables: ${skipped.length}`, margin, y);

  for (let i = 0; i < taken.length; i++){
    $('genStatus').textContent = `Procesando foto ${i+1} de ${taken.length}`;
    await new Promise(r => setTimeout(r, 0));

    doc.addPage();
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    const titleLines = doc.splitTextToSize(taken[i].item.s, pageW - margin*2);
    doc.text(titleLines, margin, margin);

    const titleHeight = titleLines.length * 16;
    const imgTopY = margin + titleHeight + 14;

    const props = doc.getImageProperties(taken[i].s.dataUrl);
    const maxW = pageW - margin*2;
    const maxH = pageH - imgTopY - margin;
    let w = maxW, h = (props.height / props.width) * w;
    if (h > maxH){ h = maxH; w = (props.width / props.height) * h; }
    const x = margin + (maxW - w) / 2;

    doc.addImage(taken[i].s.dataUrl, 'JPEG', x, imgTopY, w, h);
  }

  generatedPdfBlob = doc;
  $('doneSummary').textContent =
    `${visita.tienda} — ${taken.length} fotos incluidas` +
    (skipped.length ? `, ${skipped.length} casillas marcadas como no aplicables.` : '.');
  goto('screen-done');
}

$('btnDownload').addEventListener('click', () => {
  if (!generatedPdfBlob) return;
  const safeName = (visita.tienda || 'informe').replace(/[^a-zA-Z0-9]+/g, '_');
  generatedPdfBlob.save(`Informe_${safeName}_${visita.fecha}.pdf`);
});

$('btnShare').addEventListener('click', async () => {
  if (!generatedPdfBlob) return;
  const safeName = (visita.tienda || 'informe').replace(/[^a-zA-Z0-9]+/g, '_');
  const filename = `Informe_${safeName}_${visita.fecha}.pdf`;
  const pdfBlob = generatedPdfBlob.output('blob');
  const file = new File([pdfBlob], filename, { type: 'application/pdf' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        files: [file],
        title: filename,
        text: `Informe técnico — ${visita.tienda}`,
      });
    } catch (err) {
      // el usuario canceló el menú de compartir; no hacer nada
    }
  } else {
    // el navegador no soporta compartir archivos: se descarga como respaldo
    generatedPdfBlob.save(filename);
    alert('Tu navegador no soporta compartir directo desde aquí. El PDF se descargó — puedes compartirlo manualmente desde la carpeta de Descargas.');
  }
});

$('btnBackToList').addEventListener('click', () => {
  goto('screen-capture');
  switchTab('list');
});

window.addEventListener('beforeunload', (e) => {
  if (completedCount() > 0 && !generatedPdfBlob){
    e.preventDefault();
    e.returnValue = '';
  }
});
